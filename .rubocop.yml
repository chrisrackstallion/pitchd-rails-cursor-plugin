# This repo eats its own cooking: rails-agent-harness/rules/rubocop.mdc names
# rubocop-rails-omakase as the ruleset source of truth, so inherit it rather than
# invent a competing style. Consumers do the same in their own app — the harness
# deliberately ships no config pack.
inherit_gem:
  rubocop-rails-omakase: rubocop.yml

AllCops:
  TargetRubyVersion: 3.1
  NewCops: enable
  SuggestExtensions: false
  Exclude:
    - "rails-agent-harness/**/*"
    - "vendor/**/*"
